<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Fenêtre de 1 million de tokens : ce que relit chaque tour">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
  .p{font-size:11.5px;fill:#59636e} .b{font-weight:600} .w{fill:#ffffff;font-size:11.5px}
  .cc{fill:#8c959f} .fi{fill:#d4a72c} .cv{fill:#0969da} .tr{stroke:#59636e;stroke-width:1} .hl{stroke:#d1d9e0}
  .bord{fill:none;stroke:#d1d9e0} .seuil{stroke:#cf222e;stroke-width:2;stroke-dasharray:4 3} .rs{fill:#cf222e}
  @media (prefers-color-scheme:dark){
    text{fill:#e6edf3} .p{fill:#9198a1} .cc{fill:#656c76} .fi{fill:#bb8009} .cv{fill:#1f6feb}
    .tr{stroke:#9198a1} .hl{stroke:#3d444d} .bord{stroke:#3d444d} .seuil{stroke:#f85149} .rs{fill:#f85149}}
</style>
<defs><pattern id="h" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="7" class="hl" stroke-width="2"/></pattern></defs>
<text x="120" y="20" class="b">Fenêtre de 1 million de tokens : ce que relit chaque tour</text>
<line x1="120.0" y1="30" x2="120.0" y2="36" class="tr"/>
<text x="120.0" y="48" class="p" text-anchor="middle">0</text>
<line x1="270.0" y1="30" x2="270.0" y2="36" class="tr"/>
<text x="270.0" y="48" class="p" text-anchor="middle">250 k</text>
<line x1="420.0" y1="30" x2="420.0" y2="36" class="tr"/>
<text x="420.0" y="48" class="p" text-anchor="middle">500 k</text>
<line x1="570.0" y1="30" x2="570.0" y2="36" class="tr"/>
<text x="570.0" y="48" class="p" text-anchor="middle">750 k</text>
<line x1="720.0" y1="30" x2="720.0" y2="36" class="tr"/>
<text x="720.0" y="48" class="p" text-anchor="middle">1 M</text>
<text x="108" y="88" class="b" text-anchor="end">Avant</text>
<rect x="120.0" y="66" width="600" height="32" fill="url(#h)"/>
<rect x="120.0" y="66" width="24.0" height="32" class="cc"/>
<rect x="144.0" y="66" width="9.0" height="32" class="fi"/>
<rect x="153.0" y="66" width="267.0" height="32" class="cv"/>
<rect x="120.0" y="66" width="600" height="32" class="bord"/>
<text x="161.0" y="87" class="w">conversation</text>
<text x="570.0" y="87" class="p" text-anchor="middle">inutilisé</text>
<line x1="420.0" y1="60" x2="420.0" y2="106" class="seuil"/>
<text x="426.0" y="118" class="rs">compactage vers 500 k</text>
<text x="414.0" y="118" class="p" text-anchor="end">au pire ~500 k relus à chaque tour</text>
<text x="108" y="172" class="b" text-anchor="end">Après</text>
<rect x="120.0" y="150" width="600" height="32" fill="url(#h)"/>
<rect x="120.0" y="150" width="24.0" height="32" class="cc"/>
<rect x="144.0" y="150" width="2.4" height="32" class="fi"/>
<rect x="146.4" y="150" width="123.6" height="32" class="cv"/>
<rect x="120.0" y="150" width="600" height="32" class="bord"/>
<text x="154.4" y="171" class="w">conversation</text>
<text x="495.0" y="171" class="p" text-anchor="middle">inutilisé</text>
<line x1="270.0" y1="144" x2="270.0" y2="190" class="seuil"/>
<text x="276.0" y="202" class="rs">plafond 250 k : /avant-clear, puis /clear</text>
<text x="264.0" y="202" class="p" text-anchor="end">au pire ~250 k relus à chaque tour</text>
<text x="120" y="240" class="b">Au démarrage de chaque session (zoom de 0 à 60 k)</text>
<line x1="120.0" y1="250" x2="120.0" y2="256" class="tr"/>
<text x="120.0" y="268" class="p" text-anchor="middle">0</text>
<line x1="320.0" y1="250" x2="320.0" y2="256" class="tr"/>
<text x="320.0" y="268" class="p" text-anchor="middle">20 k</text>
<line x1="520.0" y1="250" x2="520.0" y2="256" class="tr"/>
<text x="520.0" y="268" class="p" text-anchor="middle">40 k</text>
<line x1="720.0" y1="250" x2="720.0" y2="256" class="tr"/>
<text x="720.0" y="268" class="p" text-anchor="middle">60 k</text>
<text x="108" y="295" class="b" text-anchor="end">Avant</text>
<rect x="120.0" y="278" width="400.0" height="24" class="cc"/>
<rect x="520.0" y="278" width="150.0" height="24" class="fi"/>
<text x="128.0" y="294" class="w">Claude Code ≈ 40 k</text>
<text x="678.0" y="295" class="b">≈ 55 k</text>
<text x="522.0" y="318" class="p">CLAUDE.md 23 Ko, MEMORY.md 24 Ko</text>
<text x="108" y="353" class="b" text-anchor="end">Après</text>
<rect x="120.0" y="336" width="400.0" height="24" class="cc"/>
<rect x="520.0" y="336" width="40.0" height="24" class="fi"/>
<text x="128.0" y="352" class="w">Claude Code ≈ 40 k</text>
<text x="568.0" y="353" class="b">≈ 44 k</text>
<text x="522.0" y="376" class="p">CLAUDE.md 4 Ko, MEMORY.md 8 Ko</text>
<rect x="120" y="410" width="12" height="12" class="cc"/><text x="138" y="421" class="p">Claude Code</text>
<rect x="227.2" y="410" width="12" height="12" class="fi"/><text x="245.2" y="421" class="p">CLAUDE.md + MEMORY.md</text>
<rect x="406.4" y="410" width="12" height="12" class="cv"/><text x="424.4" y="421" class="p">conversation</text>
<rect x="520.8" y="410" width="12" height="12" fill="url(#h)"/><rect x="520.8" y="410" width="12" height="12" class="bord"/><text x="538.8" y="421" class="p">inutilisé</text>
</svg>
